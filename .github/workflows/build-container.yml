name: Build AIC container

on:
  workflow_dispatch:
    inputs:
      include_bm25:
        description: "Bake BM25 text index into the image"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            INCLUDE_BM25=${{ inputs.include_bm25 && '1' || '0' }}
            PRELOAD_MODELS=1
          tags: |
            ghcr.io/${{ github.repository_owner }}/aic-video-retrieval:latest
            ghcr.io/${{ github.repository_owner }}/aic-video-retrieval:${{ github.sha }}
